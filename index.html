<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0c0818" />
    <title>Stellar Bloom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffb3d0' stroke='%2326173a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffe27a' stroke='%2326173a' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* usable area: dynamic viewport units avoid the mobile browser bar; env() keeps clear of notches */
        --sw: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        --sh: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      @supports (height: 100dvh) {
        :root { --sh: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
      }
      html, body {
        margin: 0; height: 100%; background: #0c0818; color: #f2ecff; font-family: 'Mitr', system-ui, sans-serif; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #game {
        width: min(var(--sw), calc(var(--sh) * 1.6));
        height: auto;
        aspect-ratio: 960 / 600;
        image-rendering: pixelated;
        touch-action: none;
        background: #120d24;
        border-radius: 8px;
      }
      /* portrait phones: the game is landscape-only, ask to rotate instead of showing a tiny board */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0c0818; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; line-height: 1.5; }
      #rotate b { font-size: 56px; display: block; animation: spin 2.4s ease-in-out infinite; }
      @keyframes spin { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 820px) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="600"></canvas>
    <div id="rotate" role="alert"><b>&#8635;</b><span>หมุนจอเป็นแนวนอนเพื่อเล่น</span><span>Rotate your phone to landscape to play</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
