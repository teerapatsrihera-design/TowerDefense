<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Stellar Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c0818; color: #f2ecff; font-family: 'Mitr', system-ui, sans-serif; overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #game {
        width: min(100vw, calc(100vh * 1.6));
        height: auto;
        aspect-ratio: 960 / 600;
        image-rendering: pixelated;
        touch-action: none;
        background: #120d24;
        border-radius: 8px;
      }
      a { color: #ffd76a; font-size: 12px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="600"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
